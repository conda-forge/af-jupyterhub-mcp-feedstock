schema_version: 1

context:
  version: "0.2.0"

package:
  name: af-jupyterhub-mcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/a6/40/c5c42e3e4979501d9e8a1ce1c7f69289b737cb61ff5a56350565afab0909/af_jupyterhub_mcp-${{ version }}.tar.gz
  sha256: b9c0671d475df55144d9c74a77940369864f51154098fec5ed97efa04e51efa0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - af-jupyterhub-mcp = af_jupyterhub_mcp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mcp >=2.0.0,<3
    - httpx2 >=2.5.0
    - anyio >=4.9

tests:
  - python:
      imports:
        - af_jupyterhub_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - af-jupyterhub-mcp --help

about:
  summary: MCP server for launching and driving per-user JupyterHub servers on the AF platform
  homepage: https://github.com/maniaclab/af-jupyterhub-mcp
  repository: https://github.com/maniaclab/af-jupyterhub-mcp
  documentation: https://maniaclab.uchicago.edu/af-jupyterhub-mcp/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
