schema_version: 1

context:
  version: "0.2.1"

package:
  name: af-jupyterhub-mcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/58/b3/db8d4642d212aae33e6740bcedf2af42768b487a78317caf0cc187425a55/af_jupyterhub_mcp-${{ version }}.tar.gz
  sha256: 47f0c192b2cd5903bac06d7db7950c6b8f2d3c6f0198e44a3eaa5ef82174aec7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - af-jupyterhub-mcp = af_jupyterhub_mcp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mcp >=2.0.0,<3
    - httpx2 >=2.5.0
    - anyio >=4.9

tests:
  - python:
      imports:
        - af_jupyterhub_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - af-jupyterhub-mcp --help

about:
  summary: MCP server for launching and driving per-user JupyterHub servers on the AF platform
  homepage: https://github.com/maniaclab/af-jupyterhub-mcp
  repository: https://github.com/maniaclab/af-jupyterhub-mcp
  documentation: https://maniaclab.uchicago.edu/af-jupyterhub-mcp/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
